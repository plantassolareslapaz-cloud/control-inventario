<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Pro QR</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg-primary: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #6366f1;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 12px;
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-primary); padding: 16px; margin: 0; color: var(--text-main); -webkit-font-smoothing: antialiased; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: var(--surface); padding: 24px; border-radius: var(--radius-lg); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 24px; text-align: center; border: 1px solid var(--border); }
        h2 { font-size: 22px; font-weight: 700; margin-top: 0; margin-bottom: 20px; }
        .btn-group { display: flex; gap: 12px; margin-bottom: 16px; }
        .btn { flex: 1; padding: 14px 20px; font-size: 15px; font-weight: 600; border: none; cursor: pointer; border-radius: var(--radius-md); transition: all 0.2s ease; }
        .entrada { background: var(--success); color: white; }
        .salida { background: var(--danger); color: white; }
        .activo { transform: scale(0.98); outline: 3px solid var(--warning); box-shadow: 0 0 14px rgba(245, 158, 11, 0.3); }
        #reader { width: 100%; max-width: 340px; margin: 20px auto; border-radius: var(--radius-md); overflow: hidden; border: 2px dashed var(--border) !important; }
        #resultado { margin-top: 15px; padding: 14px; border-radius: var(--radius-md); font-weight: 600; font-size: 14px; white-space: pre-line; }
        /* (El resto de estilos se mantienen igual...) */
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Control de Inventario QR</h2>
        <div class="btn-group">
            <button id="btnEntrada" class="btn entrada" onclick="cambiarModo('entrada')">Entrada (+)</button>
            <button id="btnSalida" class="btn salida" onclick="cambiarModo('salida')">Venta / Salida (-)</button>
        </div>
        <div id="modoTexto" style="color: #64748b;">Modo: Selecciona una opción para activar cámara</div>
        <div id="reader"></div>
        <div id="resultado" style="display: none;"></div>
    </div>
    
    </div>

<script>
    const API_URL = "https://control-inventario-a9bc.onrender.com"; 
    let modoActual = null;
    let html5QrcodeScanner = null;
    let escaneoBloqueo = false;

    // --- FUNCIÓN DE ESCANEO CORREGIDA ---
    function iniciarEscaner() {
        if (html5QrcodeScanner) {
            html5QrcodeScanner.clear().catch(e => console.error("Error al limpiar:", e));
        }

        const config = {
            fps: 10,
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1.0,
            rememberLastUsedCamera: true,
            facingMode: "environment" // Obliga a usar la cámara trasera
        };

        html5QrcodeScanner = new Html5QrcodeScanner("reader", config, false);

        html5QrcodeScanner.render(
            (decodedText, decodedResult) => {
                onScanSuccess(decodedText, decodedResult);
            },
            (errorMessage) => {
                // Silencioso para evitar inundar la consola
            }
        );
    }

    function cambiarModo(modo) {
        modoActual = modo;
        document.getElementById("btnEntrada").classList.toggle("activo", modo === 'entrada');
        document.getElementById("btnSalida").classList.toggle("activo", modo === 'salida');
        document.getElementById("modoTexto").innerText = `Modo: ${modo === 'entrada' ? 'ENTRADA' : 'SALIDA'}`;
        
        iniciarEscaner();
    }

    function onScanSuccess(decodedText, decodedResult) {
        if (escaneoBloqueo) return;
        escaneoBloqueo = true;

        const resultadoDiv = document.getElementById("resultado");
        resultadoDiv.style.display = "block";
        resultadoDiv.innerText = "Procesando: " + decodedText;

        fetch(`${API_URL}/movimiento`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: decodedText, cantidad: modoActual === 'entrada' ? 1 : -1 })
        })
        .then(res => res.json())
        .then(data => {
            resultadoDiv.innerText = data.detail ? `❌ ${data.detail}` : `✅ ${data.status}\nStock: ${data.nuevo_stock}`;
            setTimeout(() => { escaneoBloqueo = false; }, 3000);
        })
        .catch(() => { resultadoDiv.innerText = "❌ Error de conexión"; escaneoBloqueo = false; });
    }

    // Lógica del buscador unificada
    document.getElementById('searchInput').addEventListener('keyup', function() {
        let filter = this.value.toLowerCase();
        let tr = document.querySelectorAll('#tablaCuerpo tr');
        tr.forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(filter) ? "" : "none";
        });
    });
</script>

</body>
</html>
