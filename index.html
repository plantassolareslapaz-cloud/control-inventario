<!-- Registrar movimiento -->
<div class="max-w-6xl mx-auto px-6 mt-5">
  <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-5">
    <div class="flex items-start gap-3 mb-4">
      <div class="w-9 h-9 rounded-lg bg-blue-50 text-blue-700 flex items-center justify-center shrink-0">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></svg>
      </div>
      <div>
        <h2 class="text-base font-semibold text-gray-900">Registrar movimiento</h2>
        <p class="text-sm text-gray-500 mt-0.5">Escanea el código QR del producto para sumar o restar existencia.</p>
      </div>
    </div>

    <div class="flex flex-wrap gap-2">
      <button id="btnEntrada" onclick="cambiarModo('entrada')" class="flex-1 min-w-28 border border-gray-200 rounded-md px-4 py-2 text-sm font-medium flex items-center justify-center gap-1.5 transition-colors">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10"/><path d="M8 10l4 4 4-4"/><path d="M4 18h16"/></svg>
        Entrada
      </button>
      <button id="btnSalida" onclick="cambiarModo('salida')" class="flex-1 min-w-28 border border-gray-200 rounded-md px-4 py-2 text-sm font-medium flex items-center justify-center gap-1.5 transition-colors">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14V4"/><path d="M8 8l4-4 4 4"/><path d="M4 18h16"/></svg>
        Salida
      </button>
      <button onclick="abrirModal('nuevoModal')" class="flex-1 min-w-28 bg-blue-700 hover:bg-blue-800 text-white rounded-md px-4 py-2 text-sm font-medium flex items-center justify-center gap-1.5">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nuevo
      </button>
    </div>

    <div id="scannerArea" class="hidden mt-4">
      <div class="border border-gray-200 rounded-lg p-2 bg-gray-50">
        <div id="reader"></div>
      </div>
      <button onclick="detenerEscaneo()" class="w-full mt-2 border border-gray-200 rounded-md px-4 py-2 text-sm font-medium flex items-center justify-center gap-1.5 hover:bg-gray-50">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        Cancelar escaneo
      </button>
    </div>
  </div>
</div>

<!-- Buscar -->
<div class="max-w-6xl mx-auto px-6 mt-4">
  <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-5">
    <div class="flex items-start gap-3 mb-4">
      <div class="w-9 h-9 rounded-lg bg-orange-50 text-orange-600 flex items-center justify-center shrink-0">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </div>
      <div>
        <h2 class="text-base font-semibold text-gray-900">Buscar en el inventario</h2>
        <p class="text-sm text-gray-500 mt-0.5">Filtra por el campo que necesites.</p>
      </div>
    </div>

    <div class="flex flex-col sm:flex-row gap-2">
      <select id="filterField" class="sm:w-44 border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="codigo">Código</option>
        <option value="descripcion">Descripción</option>
        <option value="familia">Familia</option>
        <option value="marca">Marca</option>
        <option value="ubicacion">Ubicación</option>
      </select>
      <div class="relative flex-1">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Escribe para filtrar..." class="w-full pl-9 pr-3 py-2 border border-gray-200 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
    </div>

    <button id="chipBajoStock" onclick="toggleChip()" class="mt-3 border border-gray-200 text-gray-600 rounded-md px-3 py-1.5 text-xs font-medium inline-flex items-center gap-1.5">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      Solo bajo stock / agotados
    </button>
  </div>
</div>

<!-- Grid de productos -->
<div id="contenedorTarjetas" class="max-w-6xl mx-auto px-6 mt-5 pb-16 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
  <div class="col-span-full text-center py-16 text-gray-500 text-sm flex items-center justify-center gap-2">
    <span class="spinner"></span> Cargando inventario…
  </div>
</div>

<!-- Modal: Nuevo producto -->
<div id="nuevoModal" class="modal-overlay">
  <div class="bg-white rounded-lg shadow-xl w-full max-w-sm max-h-[85vh] overflow-y-auto p-5">
    <h3 class="flex items-center gap-2 text-base font-semibold text-gray-900 mb-4">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="text-blue-700"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nuevo producto
    </h3>
    <div class="space-y-2.5">
      <input type="text" id="newCod" placeholder="Código (único)*" class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      <input type="text" id="newDesc" placeholder="Descripción*" class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      <div class="grid grid-cols-2 gap-2">
        <input type="text" id="newFamilia" placeholder="Familia" class="border border-gray-200 rounded-md px-3 py-2 text-sm">
        <input type="text" id="newMarca" placeholder="Marca" class="border border-gray-200 rounded-md px-3 py-2 text-sm">
        <input type="text" id="newEstatus" placeholder="Estatus" class="border border-gray-200 rounded-md px-3 py-2 text-sm">
        <input type="number" id="newExistencia" placeholder="Existencia" value="0" class="border border-gray-200 rounded-md px-3 py-2 text-sm">
        <input type="text" id="newUnidad" placeholder="Unidad" class="border border-gray-200 rounded-md px-3 py-2 text-sm">
        <input type="text" id="newUbicacion" placeholder="Ubicación" class="border border-gray-200 rounded-md px-3 py-2 text-sm">
        <input type="text" id="newMoneda" placeholder="Moneda (MXN)" class="border border-gray-200 rounded-md px-3 py-2 text-sm">
        <input type="number" step="0.01" id="newCosto" placeholder="Último costo" class="border border-gray-200 rounded-md px-3 py-2 text-sm">
        <input type="number" step="0.01" id="newPMayoreo" placeholder="P. mayoreo" class="border border-gray-200 rounded-md px-3 py-2 text-sm">
        <input type="number" step="0.01" id="newPPublico" placeholder="P. público" class="border border-gray-200 rounded-md px-3 py-2 text-sm">
      </div>
    </div>
    <button onclick="guardarNuevo()" class="w-full mt-4 bg-blue-700 hover:bg-blue-800 text-white rounded-md px-4 py-2 text-sm font-medium">Guardar producto</button>
    <button onclick="cerrarModal('nuevoModal')" class="w-full mt-2 border border-gray-200 rounded-md px-4 py-2 text-sm font-medium hover:bg-gray-50">Cancelar</button>
  </div>
</div>

<!-- Modal: Editar producto -->
<div id="editModal" class="modal-overlay">
  <div class="bg-white rounded-lg shadow-xl w-full max-w-sm max-h-[85vh] overflow-y-auto p-5">
    <h3 class="flex items-center gap-2 text-base font-semibold text-gray-900 mb-4">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-orange-500"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      Editar <span id="editTitleCod" class="text-gray-500 font-normal"></span>
    </h3>
    <input type="hidden" id="editId">
    <input type="password" id="passInput" placeholder="Contraseña de autorización*" class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm mb-3">
    <hr class="border-gray-100 mb-3">
    <div class="space-y-2.5">
      <input type="text" id="editDesc" placeholder="Descripción*" class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm">
      <div class="grid grid-cols-2 gap-2">
        <input type="text" id="editFamilia" placeholder="Familia" class="border border-gray-200 rounded-md px-3 py-2 text-sm">
        <input type="text" id="editMarca" placeholder="Marca" class="border border-gray-200 rounded-md px-3 py-2 text-sm">
        <input type="text" id="editEstatus" placeholder="Estatus" class="border border-gray-200 rounded-md px-3 py-2 text-sm">
        <input type="number" id="editExistencia" placeholder="Existencia" class="border border-gray-200 rounded-md px-3 py-2 text-sm">
        <input type="text" id="editUnidad" placeholder="Unidad" class="border border-gray-200 rounded-md px-3 py-2 text-sm">
        <input type="text" id="editUbicacion" placeholder="Ubicación" class="border border-gray-200 rounded-md px-3 py-2 text-sm">
        <input type="text" id="editMoneda" placeholder="Moneda" class="border border-gray-200 rounded-md px-3 py-2 text-sm">
        <input type="number" step="0.01" id="editCosto" placeholder="Último costo" class="border border-gray-200 rounded-md px-3 py-2 text-sm">
        <input type="number" step="0.01" id="editPMayoreo" placeholder="P. mayoreo" class="border border-gray-200 rounded-md px-3 py-2 text-sm">
        <input type="number" step="0.01" id="editPPublico" placeholder="P. público" class="border border-gray-200 rounded-md px-3 py-2 text-sm">
      </div>
    </div>
    <button onclick="validarYEditar()" class="w-full mt-4 bg-blue-700 hover:bg-blue-800 text-white rounded-md px-4 py-2 text-sm font-medium">Actualizar</button>
    <button onclick="cerrarModal('editModal')" class="w-full mt-2 border border-gray-200 rounded-md px-4 py-2 text-sm font-medium hover:bg-gray-50">Cancelar</button>
  </div>
</div>

<!-- Modal: cantidad -->
<div id="qtyModal" class="modal-overlay">
  <div class="bg-white rounded-lg shadow-xl w-full max-w-xs p-5">
    <h3 class="text-base font-semibold text-gray-900 mb-3">Cantidad a mover — <span id="qtyCodigo" class="text-gray-500 font-normal"></span></h3>
    <input type="number" id="qtyInput" value="1" min="1" class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm mb-4">
    <button onclick="procesarMovimiento()" class="w-full bg-blue-700 hover:bg-blue-800 text-white rounded-md px-4 py-2 text-sm font-medium">Confirmar</button>
    <button onclick="cerrarModal('qtyModal')" class="w-full mt-2 border border-gray-200 rounded-md px-4 py-2 text-sm font-medium hover:bg-gray-50">Cancelar</button>
  </div>
</div>

<!-- Modal: QR grande -->
<div id="qrModal" class="modal-overlay" onclick="cerrarModal('qrModal')">
  <div class="bg-white rounded-lg shadow-xl w-full max-w-xs p-5 text-center" onclick="event.stopPropagation()">
    <h3 id="qrModalTitle" class="text-base font-semibold text-gray-900 mb-3"></h3>
    <img id="qrModalImg" src="" alt="QR ampliado" class="w-full max-w-[230px] mx-auto rounded-lg border border-gray-200 mb-3">
    <button onclick="descargarDesdeModal()" class="w-full bg-blue-700 hover:bg-blue-800 text-white rounded-md px-4 py-2 text-sm font-medium">Descargar imagen</button>
    <button onclick="cerrarModal('qrModal')" class="w-full mt-2 border border-gray-200 rounded-md px-4 py-2 text-sm font-medium hover:bg-gray-50">Cerrar</button>
  </div>
</div>

<div id="toastContainer" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[2000] flex flex-col items-center gap-2 w-[calc(100%-2rem)] max-w-sm"></div>

<script>
  const API_URL = "https://control-inventario-a9bc.onrender.com";
  const UMBRAL_BAJO = 5;

  let productosGlobales = [], modoActual = null, codEscaneado = null, scanner = null;
  let qrActualParaDescarga = '';
  let soloBajoStock = false;

  const ICON_DOWNLOAD = `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>`;
  const ICON_PENCIL = `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
  const ICON_TRASH = `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>`;

  function showToast(msg, type = '') {
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = 'text-sm px-4 py-2.5 rounded-md shadow-lg text-white text-center ' +
      (type === 'error' ? 'bg-red-600' : type === 'success' ? 'bg-green-600' : 'bg-gray-900');
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => t.remove(), 3200);
  }

  function qrUrl(codigo, size) {
    return `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(codigo)}`;
  }

  function formatearFecha(fechaStr) {
    if (!fechaStr) return '-';
    const d = new Date(fechaStr);
    return isNaN(d) ? fechaStr : d.toLocaleString('es-MX');
  }

  function formatMoney(n, moneda) {
    const v = (Number(n) || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return v + (moneda ? ' ' + moneda : '');
  }

  async function cargar() {
    try {
      const res = await fetch(`${API_URL}/productos`);
      if (!res.ok) throw new Error('bad status');
      productosGlobales = await res.json();
      aplicarFiltros();
    } catch (e) {
      document.getElementById('contenedorTarjetas').innerHTML =
        '<div class="col-span-full text-center py-16 text-gray-500 text-sm">No se pudo cargar el inventario.</div>';
      showToast('No se pudo conectar con el servidor', 'error');
    }
  }

  function aplicarFiltros() {
    const campo = document.getElementById('filterField').value;
    const texto = document.getElementById('searchInput').value.trim().toLowerCase();
    let data = productosGlobales;
    if (texto) {
      data = data.filter(p => (p[campo] || '').toString().toLowerCase().includes(texto));
    }
    if (soloBajoStock) {
      data = data.filter(p => (Number(p.existencia) || 0) <= UMBRAL_BAJO);
    }
    renderizar(data);
  }

  function toggleChip() {
    soloBajoStock = !soloBajoStock;
    const chip = document.getElementById('chipBajoStock');
    chip.classList.toggle('bg-orange-500', soloBajoStock);
    chip.classList.toggle('text-white', soloBajoStock);
    chip.classList.toggle('border-orange-500', soloBajoStock);
    chip.classList.toggle('text-gray-600', !soloBajoStock);
    chip.classList.toggle('border-gray-200', !soloBajoStock);
    aplicarFiltros();
  }

  document.getElementById('searchInput').addEventListener('keyup', aplicarFiltros);
  document.getElementById('filterField').addEventListener('change', aplicarFiltros);

  function renderizar(data) {
    const cont = document.getElementById('contenedorTarjetas');
    if (!data.length) {
      cont.innerHTML = '<div class="col-span-full text-center py-16 text-gray-500 text-sm">No hay productos que coincidan con tu búsqueda.</div>';
      return;
    }

    cont.innerHTML = data.map(p => {
      const existencia = Number(p.existencia) || 0;
      const agotado = existencia <= 0;
      const bajo = !agotado && existencia <= UMBRAL_BAJO;
      let badges = '';
      if (agotado) badges += `<span class="bg-red-100 text-red-700 rounded-full font-medium px-2 py-0.5 text-xs">Agotado</span>`;
      if (bajo) badges += `<span class="bg-orange-100 text-orange-700 rounded-full font-medium px-2 py-0.5 text-xs">Bajo stock</span>`;

      function row(label, value, strong) {
        return `<div class="flex items-center justify-between py-1.5 text-sm">
          <span class="text-gray-500">${label}</span>
          <span class="text-right max-w-[60%] truncate ${strong ? 'font-semibold text-gray-900' : 'font-medium text-gray-800'}">${value}</span>
        </div>`;
      }

      return `
      <div class="bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md transition-shadow p-5">
        <div class="flex items-start justify-between gap-2 mb-3">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="font-semibold text-gray-900">${p.codigo}</span>
            ${badges}
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <img src="${qrUrl(p.codigo, 100)}" alt="QR de ${p.codigo}" class="w-10 h-10 rounded-md border border-gray-200 cursor-pointer" onclick="abrirQRGrande('${p.codigo}')">
            <button onclick="descargarQR('${p.codigo}')" title="Descargar QR" class="w-7 h-7 border border-gray-200 rounded-md flex items-center justify-center text-gray-500 hover:bg-gray-50">${ICON_DOWNLOAD}</button>
          </div>
        </div>

        <p class="text-sm text-gray-600 mb-2">${p.descripcion}</p>

        <div class="divide-y divide-gray-100 border-t border-gray-100">
          ${row('Familia', p.familia || '-')}
          ${row('Marca', p.marca || '-')}
          ${row('Estatus', p.estatus || '-')}
          ${row('Existencia', `${existencia} ${p.unidad || ''}`, true)}
          ${row('Ubicación', p.ubicacion || '-')}
          ${row('Último costo', formatMoney(p.ultimo_costo, p.moneda))}
          ${row('P. mayoreo', formatMoney(p.precio_mayoreo, p.moneda))}
          ${row('P. público', formatMoney(p.precio_publico, p.moneda))}
          ${row('Última act.', formatearFecha(p.ultima_actualizacion))}
        </div>

        <div class="flex gap-2 mt-4">
          <button onclick="prepararEd('${p.codigo}')" class="flex-1 border border-gray-200 rounded-md px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 flex items-center justify-center gap-1.5">${ICON_PENCIL} Editar</button>
          <button onclick="borrarProducto('${p.codigo}')" class="flex-1 border border-red-200 rounded-md px-3 py-2 text-sm font-medium text-red-600 hover:bg-red-50 flex items-center justify-center gap-1.5">${ICON_TRASH} Eliminar</button>
        </div>
      </div>`;
    }).join('');
  }

  function abrirQRGrande(codigo) {
    qrActualParaDescarga = codigo;
    document.getElementById('qrModalTitle').textContent = codigo;
    document.getElementById('qrModalImg').src = qrUrl(codigo, 400);
    abrirModal('qrModal');
  }

  function descargarDesdeModal() { descargarQR(qrActualParaDescarga); }

  function descargarQR(codigo) {
    fetch(qrUrl(codigo, 400)).then(r => r.blob()).then(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `QR_${codigo}.png`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }).catch(() => window.open(qrUrl(codigo, 400), '_blank'));
  }

  function abrirModal(id) { document.getElementById(id).classList.add('open'); }
  function cerrarModal(id) {
    document.getElementById(id).classList.remove('open');
    if (scanner && id === 'qtyModal') {
      try { scanner.resume(); } catch (e) {}
    }
  }

  function cambiarModo(m) {
    modoActual = m;
    document.getElementById('scannerArea').classList.remove('hidden');

    const bEntrada = document.getElementById('btnEntrada');
    const bSalida = document.getElementById('btnSalida');
    bEntrada.className = 'flex-1 min-w-28 rounded-md px-4 py-2 text-sm font-medium flex items-center justify-center gap-1.5 transition-colors ' +
      (m === 'entrada' ? 'bg-orange-500 hover:bg-orange-600 text-white' : 'border border-gray-200 text-gray-700 hover:bg-gray-50');
    bSalida.className = 'flex-1 min-w-28 rounded-md px-4 py-2 text-sm font-medium flex items-center justify-center gap-1.5 transition-colors ' +
      (m === 'salida' ? 'bg-blue-700 hover:bg-blue-800 text-white' : 'border border-gray-200 text-gray-700 hover:bg-gray-50');

    if (scanner) { try { scanner.clear(); } catch (e) {} }
    scanner = new Html5QrcodeScanner('reader', { fps: 10, qrbox: 220 });
    scanner.render((decoded) => {
      codEscaneado = decoded;
      document.getElementById('qtyCodigo').textContent = decoded;
      abrirModal('qtyModal');
      try { scanner.pause(); } catch (e) {}
    });
  }

  function detenerEscaneo() {
    if (scanner) { try { scanner.clear(); } catch (e) {} scanner = null; }
    document.getElementById('scannerArea').classList.add('hidden');
    document.getElementById('btnEntrada').className = 'flex-1 min-w-28 border border-gray-200 rounded-md px-4 py-2 text-sm font-medium flex items-center justify-center gap-1.5 transition-colors text-gray-700 hover:bg-gray-50';
    document.getElementById('btnSalida').className = 'flex-1 min-w-28 border border-gray-200 rounded-md px-4 py-2 text-sm font-medium flex items-center justify-center gap-1.5 transition-colors text-gray-700 hover:bg-gray-50';
  }

  async function procesarMovimiento() {
    const cant = parseInt(document.getElementById('qtyInput').value);
    try {
      const res = await fetch(`${API_URL}/movimiento`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: codEscaneado, cantidad: modoActual === 'entrada' ? cant : -cant })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Error en movimiento');
      cerrarModal('qtyModal');
      document.getElementById('qtyInput').value = 1;
      showToast(`${data.status}: ${data.producto} → ${data.nuevo_stock}`, 'success');
      cargar();
      if (scanner) { try { scanner.resume(); } catch (e) {} }
    } catch (e) {
      showToast(e.message || 'Error al registrar el movimiento', 'error');
    }
  }

  function limpiarFormularioNuevo() {
    ['newCod','newDesc','newFamilia','newMarca','newEstatus','newUnidad','newUbicacion','newMoneda'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('newExistencia').value = 0;
    ['newCosto','newPMayoreo','newPPublico'].forEach(id => document.getElementById(id).value = '');
  }

  async function guardarNuevo() {
    const datos = {
      codigo: document.getElementById('newCod').value.trim(),
      descripcion: document.getElementById('newDesc').value.trim(),
      familia: document.getElementById('newFamilia').value,
      marca: document.getElementById('newMarca').value,
      estatus: document.getElementById('newEstatus').value,
      existencia: parseInt(document.getElementById('newExistencia').value || 0),
      unidad: document.getElementById('newUnidad').value,
      ubicacion: document.getElementById('newUbicacion').value,
      moneda: document.getElementById('newMoneda').value,
      ultimo_costo: parseFloat(document.getElementById('newCosto').value || 0),
      precio_mayoreo: parseFloat(document.getElementById('newPMayoreo').value || 0),
      precio_publico: parseFloat(document.getElementById('newPPublico').value || 0)
    };
    if (!datos.codigo || !datos.descripcion) { showToast('Código y descripción son obligatorios', 'error'); return; }
    try {
      const res = await fetch(`${API_URL}/productos`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Error al guardar');
      cerrarModal('nuevoModal');
      limpiarFormularioNuevo();
      showToast('Producto registrado', 'success');
      cargar();
    } catch (e) {
      showToast(e.message || 'Error al guardar el producto', 'error');
    }
  }

  function prepararEd(cod) {
    const p = productosGlobales.find(prod => prod.codigo === cod);
    document.getElementById('editId').value = p.codigo;
    document.getElementById('editTitleCod').textContent = p.codigo;
    document.getElementById('editDesc').value = p.descripcion || '';
    document.getElementById('editFamilia').value = p.familia || '';
    document.getElementById('editMarca').value = p.marca || '';
    document.getElementById('editEstatus').value = p.estatus || '';
    document.getElementById('editExistencia').value = p.existencia || 0;
    document.getElementById('editUnidad').value = p.unidad || '';
    document.getElementById('editUbicacion').value = p.ubicacion || '';
    document.getElementById('editMoneda').value = p.moneda || '';
    document.getElementById('editCosto').value = p.ultimo_costo || 0;
    document.getElementById('editPMayoreo').value = p.precio_mayoreo || 0;
    document.getElementById('editPPublico').value = p.precio_publico || 0;
    document.getElementById('passInput').value = '';
    abrirModal('editModal');
  }

  async function validarYEditar() {
    if (document.getElementById('passInput').value !== 'admin123') {
      showToast('Contraseña incorrecta', 'error');
      return;
    }
    const codigo = document.getElementById('editId').value;
    const datos = {
      password: document.getElementById('passInput').value,
      descripcion: document.getElementById('editDesc').value,
      familia: document.getElementById('editFamilia').value,
      marca: document.getElementById('editMarca').value,
      estatus: document.getElementById('editEstatus').value,
      existencia: parseInt(document.getElementById('editExistencia').value || 0),
      unidad: document.getElementById('editUnidad').value,
      ubicacion: document.getElementById('editUbicacion').value,
      moneda: document.getElementById('editMoneda').value,
      ultimo_costo: parseFloat(document.getElementById('editCosto').value || 0),
      precio_mayoreo: parseFloat(document.getElementById('editPMayoreo').value || 0),
      precio_publico: parseFloat(document.getElementById('editPPublico').value || 0)
    };
    try {
      const res = await fetch(`${API_URL}/productos/${codigo}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos)
      });
      if (!res.ok) { const d = await res.json(); throw new Error(d.detail || 'Error al actualizar'); }
      cerrarModal('editModal');
      showToast('Producto actualizado', 'success');
      cargar();
    } catch (e) {
      showToast(e.message || 'Error al actualizar', 'error');
    }
  }

  async function borrarProducto(codigo) {
    if (!confirm(`¿Eliminar permanentemente el código ${codigo}?`)) return;
    try {
      const res = await fetch(`${API_URL}/productos/${codigo}`, { method: 'DELETE' });
      if (!res.ok) { const d = await res.json(); throw new Error(d.detail || 'Error al eliminar'); }
      showToast('Producto eliminado', 'success');
      cargar();
    } catch (e) {
      showToast(e.message || 'No se pudo conectar con el servidor', 'error');
    }
  }

  window.onload = cargar;
</script>
</body>
</html>
